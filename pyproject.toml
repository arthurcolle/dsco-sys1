[project]
name = "dsco-sys1"
version = "0.1.0"
description = "Small deep decision model and decision-quality tooling for autonomous agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["torch>=2.4", "tokenizers>=0.20", "numpy"]

[project.optional-dependencies]
corpus = ["datasets>=3", "huggingface-hub>=0.25", "pyarrow>=17"]
tokenizer-eval = ["tiktoken>=0.8"]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sys1*"]

[tool.setuptools.package-data]
"sys1.vocab" = ["*.json"]
"sys1.jevmr" = ["jobs/*.json", "run_loop.sh"]
